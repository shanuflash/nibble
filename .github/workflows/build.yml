name: Build

# Manual only: run it from the Actions tab. Nothing triggers on push or pull requests.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the exe, e.g. 0.4.1"
        required: true
        default: "0.4.0"
      release:
        description: "Also publish a GitHub Release (tag v<version>) with the exe attached"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        env:
          NIBBLE_VERSION: ${{ inputs.version }}
        run: build.cmd

      - name: Upload unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Nibble-${{ inputs.version }}-unsigned
          path: bin/Nibble.exe

      # Code signing through SignPath Foundation. Skipped until the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set.
      - name: Sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nibble
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the exe to ship
        shell: pwsh
        run: |
          $exe = if (Test-Path signed/Nibble.exe) { 'signed/Nibble.exe' } else { 'bin/Nibble.exe' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/Nibble.exe
          $hash = (Get-FileHash dist/Nibble.exe -Algorithm SHA256).Hash
          "Shipping $exe" >> $env:GITHUB_STEP_SUMMARY
          "SHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Nibble-${{ inputs.version }}
          path: dist/Nibble.exe

      - name: Publish release
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" dist/Nibble.exe --title "Nibble ${{ inputs.version }}" --generate-notes
